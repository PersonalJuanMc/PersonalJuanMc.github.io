<meta name="description" content="The DRAGON TALES Web site on PBS Online introduces visitors to six-year-old Emmy and her four-year-old brother Max on their visits to Dragon Land. In the course of their adventures, the children and their young dragon friends help each other face fears, build confidence, and learn new ways to deal with problems they encounter. DRAGON TALES' unique format and characters are designed to help preschoolers handle everyday challenges such as making friends, coping with fear of the dark, and learning new skills. This Web site offers materials to complement the PBS children's television program including character and place descriptions, games, printable coloring pages, information for parents and other.">
